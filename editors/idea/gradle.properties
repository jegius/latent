# Плагин написан на Java; Kotlin stdlib из IntelliJ Platform не подключаем.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Каталог кеша IntelliJ Platform Gradle Plugin (по умолчанию .intellijPlatform в проекте).
org.jetbrains.intellij.platform.selfUpdateCheck=false
