<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Latent">
  <defs>
    <linearGradient id="latent-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b2b"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="latent-fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#latent-bg)" stroke="url(#latent-fg)" stroke-width="2"/>
  <!-- «L»: вертикальная стойка и горизонтальная база -->
  <path d="M20 16 L20 44 L44 44" fill="none" stroke="url(#latent-fg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Три узла-нейрона: намёк на AI-природу языка -->
  <circle cx="20" cy="16" r="3.5" fill="#a78bfa"/>
  <circle cx="44" cy="44" r="3.5" fill="#38bdf8"/>
  <circle cx="44" cy="26" r="2.5" fill="#a78bfa" opacity="0.7"/>
  <path d="M44 26 L44 40" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
</svg>
